# =============================================================================
# Security-Finance — compose de produção local
# Versões consolidadas: mariadb:11.4 (LTS) + imagem da API (node:22-alpine).
# Ordem de subida com validação:
#   db (healthy) -> migrate (completed_successfully) -> api (healthy)
# O `depends_on: service_completed_successfully` da API é o VALIDADOR da
# migration: se `prisma migrate deploy` falhar, a API nem é iniciada.
# =============================================================================

name: security-finance

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
      MARIADB_DATABASE: ${DB_NAME:-security_finance}
      MARIADB_USER: ${DB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: aplica as migrations e sai com 0. A API só sobe se ele tiver
  # terminado com sucesso (service_completed_successfully).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${DB_USER:-app}:${DB_PASSWORD:?Defina DB_PASSWORD no .env}@db:3306/${DB_NAME:-security_finance}"
    command: ["sh", "-c", "npx prisma migrate deploy"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      # Mesmo formato aceito pelo driver mariadb via @prisma/adapter-mariadb.
      # Se a senha tiver caracteres especiais, use URL-encoding (%40 p/ @ etc.)
      DATABASE_URL: "mysql://${DB_USER:-app}:${DB_PASSWORD:?Defina DB_PASSWORD no .env}@db:3306/${DB_NAME:-security_finance}"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
    ports:
      - "${PORT:-5000}:5000"
    healthcheck:
      # GET / (AppController) responde 200 quando o Nest está no ar
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${PORT:-5000}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
    name: security-finance-db-data
